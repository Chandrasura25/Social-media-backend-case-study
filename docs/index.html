<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Media API · Docs</title>
    <meta name="description" content="Interactive API docs for a TypeScript social media backend: JWT auth, posts, feed, likes, comments, real-time notifications.">
    <script type="module" src="https://cdn.jsdelivr.net/npm/rapidoc@9.3.8/dist/rapidoc-min.js"></script>
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <rapi-doc
      spec-url="openapi.json"
      theme="dark"
      bg-color="#0b1324"
      text-color="#e2e8f0"
      primary-color="#38bdf8"
      render-style="read"
      layout="column"
      show-header="false"
      allow-try="false"
      schema-style="table"
      default-schema-tab="example"
      nav-bg-color="#0f1b33"
    ></rapi-doc>
  </body>
</html>
